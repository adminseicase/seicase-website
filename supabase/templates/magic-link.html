<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your sign-in link</title>
  </head>
  <body
    style="margin: 0; padding: 32px 12px; background: #f6eee7; font-family: &quot;Helvetica Neue&quot;, Arial, sans-serif; color: #1f1a17"
  >
    <span style="display: none; max-height: 0; overflow: hidden">Your seicase sign-in link</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 560px" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center" style="padding-bottom: 22px; font-family: Georgia, &quot;Times New Roman&quot;, serif; font-size: 36px">
                seicase
              </td>
            </tr>
            <tr>
              <td style="background: #fbf7f3; border: 1px solid #e6dad0; border-radius: 14px; padding: 32px">
                <h1
                  style="
                    margin: 0 0 12px;
                    font-family: Georgia, &quot;Times New Roman&quot;, serif;
                    font-weight: 400;
                    font-size: 30px;
                    line-height: 1.2;
                  "
                >
                  Your sign-in link
                </h1>
                <p style="margin: 0 0 22px; font-size: 15px; line-height: 1.65">
                  Tap the button below to sign in to seicase. This link works once and expires in one hour.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #1f1a17;
                    color: #f6eee7;
                    text-decoration: none;
                    padding: 14px 26px;
                    border-radius: 6px;
                    font-size: 14px;
                    letter-spacing: 0.04em;
                  "
                  >Sign in to seicase &rarr;</a
                >
                <p style="margin: 22px 0 0; font-size: 13px; line-height: 1.6; color: #6f6158">
                  If you didn&rsquo;t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top: 24px; font-family: Georgia, serif; font-size: 17px">
                More than a bag. A part of your story.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top: 8px; font-size: 12px; color: #6f6158">seicase &middot; Chennai, India</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
